env: dev
region: us-east-1
pipeline_name: llm-finetune-dev
model_package_group: llm-finetune-dev

base_model: Qwen/Qwen2.5-0.5B-Instruct
training:
  instance_type: ml.g5.xlarge
  instance_count: 1
  max_run_seconds: 7200
  volume_size_gb: 50
  hyperparameters:
    epochs: "1"
    learning_rate: "2e-4"
    per_device_train_batch_size: "4"
    lora_r: "8"
    lora_alpha: "16"
    lora_dropout: "0.05"
    max_seq_length: "512"

processing:
  instance_type: ml.m5.xlarge
  instance_count: 1
  max_runtime_seconds: 3600

quality_gate:
  min_quality_score: 0.88
  max_eval_loss: 2.5

s3:
  # Filled by Terraform outputs / scripts (placeholders for local docs)
  data_prefix: data/raw
  processed_prefix: data/processed
  model_prefix: models
  eval_prefix: evaluation

# Must match pipeline/definition.py HF_* constants (train+inference DLC pair)
transformers_version: "4.48.0"
pytorch_version: "2.3.0"
py_version: "py311"
