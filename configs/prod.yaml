env: prod
region: us-east-1
pipeline_name: llm-finetune-prod
model_package_group: llm-finetune-prod

base_model: Qwen/Qwen2.5-0.5B-Instruct
training:
  instance_type: ml.g5.xlarge
  instance_count: 1
  max_run_seconds: 10800
  volume_size_gb: 50
  hyperparameters:
    epochs: "2"
    learning_rate: "2e-4"
    per_device_train_batch_size: "4"
    lora_r: "16"
    lora_alpha: "32"
    lora_dropout: "0.05"
    max_seq_length: "512"

processing:
  instance_type: ml.m5.xlarge
  instance_count: 1
  max_runtime_seconds: 3600

quality_gate:
  min_quality_score: 0.90
  max_eval_loss: 2.0

s3:
  data_prefix: data/raw
  processed_prefix: data/processed
  model_prefix: models
  eval_prefix: evaluation

transformers_version: "4.48.0"
pytorch_version: "2.3.0"
py_version: "py311"
